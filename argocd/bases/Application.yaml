apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: Application
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Organisation/platform-infrastructure.git
    targetRevision: test-helm-vals
    path: ""
    kustomize:
      commonLabels:
        app.kubernetes.io/instance: "test-helm-vals"
  destination:
    server: https://kubernetes.default.svc
    namespace: Application
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
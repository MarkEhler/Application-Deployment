apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: Backend

configMapGenerator:
  - name: Backend-configmap
    files:
      - Backend-configmap.yaml

resources:
- Backend-deployment.yaml
- Backend-service.yaml
- Backend-secret.yaml
- Frontend-deployment.yaml
- Frontend-service.yaml
- tileserver-deployment.yaml
- tileserver-service.yaml
- tileserver-secret.yaml
- ingress.yaml
- acr-secret.yaml